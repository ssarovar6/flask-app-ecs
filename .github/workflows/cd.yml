name: Continuos Deployment
on:
  workflow_call:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
      DOCKER_TAG: ${{ github.sha }}
    steps:
      - name: code checkout
        uses: actions/checkout@v4
      - name: ssh to prod server & cretae app folder
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_SSH_HOST }}
          username: ${{ secrets.EC2_SSH_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          scripts: |
            echo "Install required package & folder"
            sudo apt update -y
            sudo apt install docker.io -y
            sudo apt install docker-compose-v2 -y
            sudo usermod -aG docker $USER && newgrp docker
            mkdir -p devops
      - name: copy docker compose file
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_SSH_HOST }}
          username: ${{ secrets.EC2_SSH_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          source: docker-compose.yml
          target: ~/devops
      - name: SSH to prod server & run the app
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_SSH_HOST }}
          username: ${{ secrets.EC2_SSH_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          scripts: |
            echo "Running APP"
            export DOCKERHUB_USERNAME= ${{ VARS.DOCKERHUB_USERNAME }}
            export DOCKER_TAG: ${{ github.sha }}
            echo ${{ secrets.DOCKERHUB_TOKEN }}| docker login --username ${{ vars.DOCKERHUB_USERNAME }} --password-stdin
            cd ~/devops && docker compose down && docker compose up -d --build --force-recreate --pull always
