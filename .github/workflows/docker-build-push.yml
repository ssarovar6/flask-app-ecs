# Dockerfile scan using hadolint,
# Image build , Image scan using Trivy ,
# Login and pushed to DockerHub
 

name: Image Build and Push
on:
  push:
    branches: [dev]
jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: code checkout
        uses: actions/checkout@v4
      - name: validate Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with: 
          dockerfile: Dockerfile
      - name: Build Docker Image
        run: docker build -t ${{ vars.DOCKERHUB_USERNAME }}/flask-app:${{ github.sha }} .
      - name: Trivy Scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ vars.DOCKERHUB_USERNAME }}/flask-app:${{ github.sha }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit code: '1'
          trivyignore: ${{ github.workspace }}/.trivyignore
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: push scanned image to dockerhub
        run: docker push ${{ vars.DOCKERHUB_USERNAME }}/flask-app:${{ github.sha }}